<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ماتشا بوتيك | المتجر والإدارة</title>
  <style>
    :root {
      --matcha-dark: #2b442e;
      --matcha: #4b744e;
      --matcha-soft: #d9e7d6;
      --mask: #f4f8f3;
      --cream: #fbfaf6;
      --ink: #212a22;
      --muted: #647366;
      --border: #dde7db;
      --danger: #b43838;
      --success: #286b3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--cream);
      color: var(--ink);
      line-height: 1.65;
      min-height: 100vh;
    }

    /* الهيدر */
    header {
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--matcha-dark);
    }

    .menu-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: var(--matcha-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* القائمة الجانبية */
    .sidebar {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100%;
      background: #fff;
      box-shadow: -5px 0 15px rgba(0,0,0,0.1);
      transition: 0.3s ease;
      z-index: 1000;
      padding: 2rem;
    }

    .sidebar.active {
      right: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .sidebar-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .nav-links {
      list-style: none;
    }

    .nav-links li {
      margin-bottom: 1rem;
    }

    .nav-links a, .nav-links button {
      color: var(--ink);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: right;
      padding: 8px 0;
      display: block;
    }

    .nav-links a:hover, .nav-links button:hover {
      color: var(--matcha);
    }

    .admin-link {
      color: var(--danger) !important;
      font-weight: bold !important;
      border-top: 1px solid var(--border);
      margin-top: 1rem;
      padding-top: 1rem !important;
    }

    /* المحتوى */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .product-img {
      height: 180px;
      background: var(--mask);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    /* بوابة الإدارة */
    .admin-portal {
      display: none;
      background: #1a211b;
      color: #dceadc;
      border-radius: 16px;
      padding: 2rem;
    }

    .user-card {
      background: #253127;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .role-badge {
      background: var(--matcha);
      color: #fff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍵 ماتشا </div>
    <button class="menu-btn" onclick="toggleSidebar()">
      <span>☰</span> القائمة
    </button>
  </header>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>القائمة</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">✕</button>
    </div>
    <ul class="nav-links">
      <li><a href="#" onclick="showSection('store')">الرئيسية</a></li>
      <li><a href="#" onclick="showSection('store')">منتجات مخفضة</a></li>
      <li><a href="#" onclick="showSection('store')">أنواع الماتشا</a></li>
      <li><a href="#" onclick="showSection('store')">الأكثر مبيعاً</a></li>
      <li><button onclick="alert('صفحة تسجيل الدخول')">تسجيل الدخول / إنشاء حساب</button></li>
      <li><a href="#" class="admin-link" onclick="showSection('admin')">🔒 بوابة الإدارة (الأدمن)</a></li>
    </ul>
  </div>

  <div class="container">
    <section id="storeSection">
      <h2>المنتجات المميزة</h2>
      <br>
      <div class="store-grid">
        <div class="product-card">
          <div class="product-img">🍵</div>
          <h3>ماتشا احتفالية</h3>
          <p>115 ر.س</p>
        </div>
        <div class="product-card">
          <div class="product-img">🧋</div>
          <h3>آيس ماتشا لاتيه</h3>
          <p>24 ر.س</p>
        </div>
        <div class="product-card">
          <div class="product-img">🍪</div>
          <h3>كوكيز الماتشا</h3>
          <p>16 ر.س</p>
        </div>
      </div>
    </section>

    <section id="adminSection" class="admin-portal">
      <h2>لوحة تحكم النظام (الأدمن)</h2>
      <p>إدارة المستخدمين والصلاحيات</p>
      <div id="usersList" style="margin-top:1rem;"></div>
    </section>
  </div>

  <script>
    const mockUsers = [
      { id: 1, name: "فاطمه هلال", contact: "fatmah@matcha.sa", role: "admin" },
      { id: 2, name: "عائشه الدوسري", contact: "aisha@matcha.sa", role: "customer" },
      { id: 3, name: "مي بالحارث", contact: "may@matcha.sa", role: "customer" }
    ];

    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("active");
    }

    function showSection(section) {
      toggleSidebar();
      const store = document.getElementById("storeSection");
      const admin = document.getElementById("adminSection");
      
      if (section === 'store') {
        store.style.display = 'block';
        admin.style.display = 'none';
      } else {
        store.style.display = 'none';
        admin.style.display = 'block';
        renderUsers();
      }
    }

    function renderUsers() {
      const container = document.getElementById("usersList");
      container.innerHTML = mockUsers.map(u => `
        <div class="user-card">
          <div>
            <strong>${u.name}</strong><br>
            <small>${u.contact}</small>
          </div>
          <div>
            <span class="role-badge">${u.role === 'admin' ? 'مشرف (Admin)' : 'عميل (Customer)'}</span>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
