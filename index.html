<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب المستخدم</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff0f5;
    color: #315443;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    background: white;
    width: 100%;
    max-width: 480px;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 25px #286b4a18;
}

h1, h2, h3 { text-align: center; color: #c45c86; }
.subtitle { text-align: center; color: #777; margin-bottom: 25px; }

input, select {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #e8cbd7;
    border-radius: 9px;
    font-size: 15px;
    background: white;
}

input:focus, select:focus {
    outline: 2px solid #b9dfc5;
}

label { font-weight: bold; font-size: 14px; }

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #39845c;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover { background: #286b4a; }

.secondary {
    background: #fce4ed;
    color: #a94f73;
}

.secondary:hover { background: #f8d0df; }

.danger { background: #d9534f; }
.danger:hover { background: #b53d39; }

.hidden { display: none; }

.link {
    text-align: center;
    color: #b34f79;
    cursor: pointer;
    margin-top: 18px;
}

hr {
    border: 0;
    border-top: 1px solid #f0dce5;
    margin: 22px 0;
}

.address, .user-card {
    background: #eff8f1;
    padding: 15px;
    border-radius: 9px;
    margin: 12px 0;
    border: 1px solid #d5ebd9;
}

.badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #fce4ed;
    color: #a94f73;
    margin-bottom: 8px;
}

.badge.admin {
    background: #39845c;
    color: white;
}

.message {
    color: #d9534f;
    text-align: center;
    font-size: 14px;
    margin-top: 10px;
}
</style>
</head>

<body>
<div class="container">

<!-- قسم تسجيل الدخول -->
<section id="login">
<h1>مرحباً بعودتك 🌸</h1>
<p class="subtitle">سجل الدخول للوصول إلى حسابك</p>

<form id="loginForm">
<label>الاسم أو البريد الإلكتروني</label>
<input id="loginName" type="text" placeholder="أدخل اسمك أو بريدك الإلكتروني" required>

<label>كلمة المرور</label>
<input id="loginPassword" type="password" placeholder="أدخل كلمة المرور" required>

<button type="submit">تسجيل الدخول</button>
</form>

<p class="link" onclick="showRegister()">ليس لديك حساب؟ إنشاء حساب جديد</p>
<p id="loginMessage" class="message"></p>
</section>

<!-- قسم إنشاء حساب -->
<section id="register" class="hidden">
<h1>إنشاء حساب جديد 💗</h1>
<p class="subtitle">أدخل بياناتك لإنشاء حسابك</p>

<form id="registerForm">
<label>الاسم الكامل</label>
<input id="regName" type="text" placeholder="الاسم الكامل" required>

<label>البريد الإلكتروني</label>
<input id="regEmail" type="email" placeholder="example@email.com" required>

<label>رقم الجوال</label>
<input id="regPhone" type="tel" placeholder="05xxxxxxxx" required>

<label>كلمة المرور</label>
<input id="regPassword" type="password" placeholder="8 أحرف على الأقل" required minlength="8">

<label>تأكيد كلمة المرور</label>
<input id="regConfirm" type="password" placeholder="أعد كتابة كلمة المرور" required>

<button type="submit">إنشاء الحساب</button>
</form>

<p class="link" onclick="showLogin()">لديك حساب؟ تسجيل الدخول</p>
<p id="registerMessage" class="message"></p>
</section>

<!-- قسم الملف الشخصي للعميل -->
<section id="profile" class="hidden">
<h1>الملف الشخصي 💚</h1>
<p class="subtitle">إدارة بيانات حسابك</p>

<label>الاسم الكامل</label>
<input id="profileName" type="text">

<label>البريد الإلكتروني</label>
<input id="profileEmail" type="email">

<label>رقم الجوال</label>
<input id="profilePhone" type="tel">

<button onclick="saveProfile()">حفظ التعديلات</button>

<hr>
<h2>عناوين التوصيل 📍</h2>
<div id="addressList"></div>

<h3>إضافة عنوان جديد</h3>
<form id="addressForm">
<label>المدينة</label>
<input id="city" type="text" placeholder="المدينة" required>

<label>الحي</label>
<input id="district" type="text" placeholder="الحي" required>

<label>الشارع</label>
<input id="street" type="text" placeholder="الشارع" required>

<label>الموقع أو وصف العنوان</label>
<input id="location" type="text" placeholder="وصف الموقع" required>

<button type="submit">إضافة العنوان</button>
</form>

<hr>
<button class="danger" onclick="logout()">تسجيل الخروج</button>
</section>

<!-- قسم لوحة تحكم المشرف -->
<section id="adminPanel" class="hidden">
<h1>لوحة تحكم المشرف 🛡️</h1>
<p class="subtitle">إدارة الحسابات والصلاحيات والتعديلات</p>

<h2>الحسابات المسجلة 👥</h2>
<div id="adminUsersList"></div>

<hr>
<button class="danger" onclick="logout()">تسجيل الخروج من لوحة المشرف</button>
</section>

</div>

<script>
// تعريف حساب المشرف الافتراضي
let users = [
    {
        name: "المشرف العام",
        email: "admin@matcha.sa",
        phone: "0500000000",
        password: "admin123",
        role: "admin",
        addresses: []
    }
];

let currentUser = null;

function hideAllSections() {
    login.classList.add("hidden");
    register.classList.add("hidden");
    profile.classList.add("hidden");
    adminPanel.classList.add("hidden");
}

function showLogin() {
    hideAllSections();
    loginMessage.textContent = "";
    login.classList.remove("hidden");
}

function showRegister() {
    hideAllSections();
    registerMessage.textContent = "";
    register.classList.remove("hidden");
}

registerForm.onsubmit = function(e) {
    e.preventDefault();

    let name = regName.value.trim();
    let email = regEmail.value.trim().toLowerCase();
    let phone = regPhone.value.trim();
    let password = regPassword.value;
    let confirm = regConfirm.value;

    if (password !== confirm) {
        registerMessage.textContent = "كلمتا المرور غير متطابقتين";
        return;
    }

    if (users.some(u => u.email === email || u.phone === phone)) {
        registerMessage.textContent = "البريد أو الجوال مستخدم مسبقاً";
        return;
    }

    users.push({
        name, email, phone, password,
        role: "customer",
        addresses: []
    });

    alert("تم إنشاء الحساب بنجاح");
    this.reset();
    showLogin();
};

loginForm.onsubmit = function(e) {
    e.preventDefault();

    let identity = loginName.value.trim().toLowerCase();
    let password = loginPassword.value;

    let user = users.find(u =>
        (u.email === identity ||
         u.name.toLowerCase() === identity ||
         u.phone === identity) &&
        u.password === password
    );

    if (!user) {
        loginMessage.textContent = "بيانات الدخول غير صحيحة";
        return;
    }

    currentUser = user;
    loginMessage.textContent = "";

    if (currentUser.role === "admin") {
        showAdminPanel();
    } else {
        showProfile();
    }
};

function showProfile() {
    hideAllSections();
    profile.classList.remove("hidden");

    profileName.value = currentUser.name;
    profileEmail.value = currentUser.email;
    profilePhone.value = currentUser.phone;

    displayAddresses();
}

function showAdminPanel() {
    hideAllSections();
    adminPanel.classList.remove("hidden");
    renderAdminUsers();
}

function renderAdminUsers() {
    adminUsersList.innerHTML = "";

    users.forEach((u, index) => {
        let card = document.createElement("div");
        card.className = "user-card";

        let badge = document.createElement("span");
        badge.className = u.role === "admin" ? "badge admin" : "badge";
        badge.textContent = u.role === "admin" ? "مشرف (Admin)" : "عميل (Customer)";

        let nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = u.name;
        nameInput.placeholder = "الاسم";

        let emailInput = document.createElement("input");
        emailInput.type = "email";
        emailInput.value = u.email;
        emailInput.placeholder = "البريد الإلكتروني";

        let phoneInput = document.createElement("input");
        phoneInput.type = "tel";
        phoneInput.value = u.phone;
        phoneInput.placeholder = "رقم الجوال";

        let roleSelect = document.createElement("select");
        roleSelect.innerHTML = `
            <option value="customer" ${u.role === "customer" ? "selected" : ""}>عميل (Customer)</option>
            <option value="admin" ${u.role === "admin" ? "selected" : ""}>مشرف (Admin)</option>
        `;

        let saveBtn = document.createElement("button");
        saveBtn.textContent = "حفظ التعديلات";
        saveBtn.onclick = () => {
            let newEmail = emailInput.value.trim().toLowerCase();
            if (!nameInput.value.trim() || !newEmail || !phoneInput.value.trim()) {
                alert("يرجى تعبئة جميع الحقول");
                return;
            }
            if (users.some((other, i) => i !== index && other.email === newEmail)) {
                alert("هذا البريد مستخدم لحساب آخر");
                return;
            }
            u.name = nameInput.value.trim();
            u.email = newEmail;
            u.phone = phoneInput.value.trim();
            u.role = roleSelect.value;
            alert("تم تحديث بيانات المستخدم بنجاح");
            renderAdminUsers();
        };

        card.appendChild(badge);
        card.appendChild(nameInput);
        card.appendChild(emailInput);
        card.appendChild(phoneInput);
        card.appendChild(roleSelect);
        card.appendChild(saveBtn);

        if (u.email !== "admin@matcha.sa") {
            let delBtn = document.createElement("button");
            delBtn.className = "danger";
            delBtn.textContent = "حذف الحساب";
            delBtn.onclick = () => {
                users.splice(index, 1);
                renderAdminUsers();
            };
            card.appendChild(delBtn);
        }

        adminUsersList.appendChild(card);
    });
}

function saveProfile() {
    let email = profileEmail.value.trim().toLowerCase();

    if (!email || !profileName.value.trim() || !profilePhone.value.trim()) {
        alert("يرجى تعبئة جميع البيانات");
        return;
    }

    if (users.some(u => u !== currentUser && u.email === email)) {
        alert("البريد الإلكتروني مستخدم مسبقاً");
        return;
    }

    currentUser.name = profileName.value.trim();
    currentUser.email = email;
    currentUser.phone = profilePhone.value.trim();

    alert("تم تحديث بيانات الحساب");
}

addressForm.onsubmit = function(e) {
    e.preventDefault();

    currentUser.addresses.push({
        city: city.value.trim(),
        district: district.value.trim(),
        street: street.value.trim(),
        location: location.value.trim()
    });

    this.reset();
    displayAddresses();
};

function displayAddresses() {
    addressList.innerHTML = "";

    currentUser.addresses.forEach((a, index) => {
        let div = document.createElement("div");
        div.className = "address";

        let info = document.createElement("p");
        info.textContent = `${a.city} - ${a.district} - ${a.street} - ${a.location}`;

        let btn = document.createElement("button");
        btn.className = "danger";
        btn.textContent = "حذف العنوان";

        btn.onclick = () => {
            currentUser.addresses.splice(index, 1);
            displayAddresses();
        };

        div.appendChild(info);
        div.appendChild(btn);
        addressList.appendChild(div);
    });
}

function logout() {
    currentUser = null;
    loginForm.reset();
    showLogin();
}
</script>
</body>
</html>
