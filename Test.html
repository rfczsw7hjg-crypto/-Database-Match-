<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تجربة المنتجات والأسعار | ماتشا بوتيك</title>
  <style>
    :root {
      --matcha-dark: #264229;
      --matcha: #47724b;
      --matcha-soft: #eaf3e8;
      --cream: #fbfaf6;
      --card: #ffffff;
      --ink: #1e281f;
      --muted: #627264;
      --border: #dce7da;
      --danger: #b43838;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      padding: 1.5rem;
      line-height: 1.6;
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
    }

    .top-bar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--cream);
      color: var(--ink);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .cat-btn.active {
      background: var(--matcha);
      color: #fff;
      border-color: var(--matcha);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .thumb {
      height: 150px;
      background: var(--matcha-soft);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      margin-bottom: 0.9rem;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tag {
      display: inline-block;
      background: var(--matcha-soft);
      color: var(--matcha-dark);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.5rem 0;
      font-weight: 700;
      color: var(--matcha-dark);
    }

    .addons {
      background: #f7faf6;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      margin: 0.6rem 0 0.9rem;
      font-size: 0.88rem;
    }

    .addons label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .addons label:last-child {
      margin-bottom: 0;
    }

    .btn {
      background: var(--matcha);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: var(--matcha-dark);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .manage-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.9rem;
      background: #fff;
    }

    .admin-list {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-row {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions {
      display: flex;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div>
        <h2>🍵 ماتشا بوتيك — تجربة المنتجات</h2>
        <p style="color: var(--muted); font-size: 0.9rem;">اختبري التصنيفات، السعر مع الإضافات، والإضافة/التعديل/الحذف</p>
      </div>
      <div class="filters" id="categoryButtons"></div>
    </div>

    <div class="grid" id="productsGrid"></div>

    <div class="manage-box">
      <h3>إدارة المنتجات والأسعار (تجربة سريعة)</h3>
      <form class="form-grid" onsubmit="addProduct(event)">
        <input type="text" id="pName" placeholder="اسم المنتج" required />
        <input type="text" id="pDesc" placeholder="وصف مختصر" required />
        <input type="number" id="pPrice" placeholder="السعر (ر.س)" min="1" step="0.5" required />
        <input type="number" id="pQty" placeholder="الكمية المتوفرة" min="0" value="10" required />
        <select id="pCat">
          <option value="ماتشا احتفالية">ماتشا احتفالية</option>
          <option value="مشروبات">مشروبات</option>
          <option value="حلويات">حلويات</option>
        </select>
        <input type="text" id="pVisual" placeholder="أيقونة أو رابط صورة (مؤقت)" value="🍵" />
        <button type="submit" class="btn">إضافة منتج</button>
      </form>

      <div class="admin-list" id="manageList"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = ["الكل", "ماتشا احتفالية", "مشروبات", "حلويات"];
    const ADDONS = [
      { id: "oat", label: "حليب شوفان", price: 5 },
      { id: "honey", label: "إضافة عسل طبيعي", price: 4 },
      { id: "extra", label: "شوت ماتشا إضافي", price: 7 }
    ];

    let selectedCategory = "الكل";
    let products = [
      {
        id: 1,
        name: "ماتشا أوجي الفاخرة",
        desc: "ماتشا يابانية نقية بقوام كريمي ومتوازن.",
        price: 115,
        qty: 12,
        category: "ماتشا احتفالية",
        visual: "🍵"
      },
      {
        id: 2,
        name: "آيس ماتشا لاتيه",
        desc: "منعش مع ثلج وحليب بارد ونكهة ماتشا واضحة.",
        price: 24,
        qty: 20,
        category: "مشروبات",
        visual: "🧋"
      },
      {
        id: 3,
        name: "كوكيز الماتشا بالشوكولاتة البيضاء",
        desc: "مخبوز طازج بمذاق الماتشا وحبيبات الشوكولاتة.",
        price: 18,
        qty: 15,
        category: "حلويات",
        visual: "🍪"
      }
    ];

    function renderCategories() {
      const box = document.getElementById("categoryButtons");
      box.innerHTML = CATEGORIES.map(cat => `
        <button class="cat-btn ${selectedCategory === cat ? "active" : ""}" onclick="selectCat('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    function selectCat(cat) {
      selectedCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderVisual(visual, name) {
      if (visual && (visual.startsWith("http") || visual.startsWith("data:image") || visual.includes("/"))) {
        return `<img src="${visual}" alt="${name}" />`;
      }
      return visual || "🍵";
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const list = selectedCategory === "الكل"
        ? products
        : products.filter(p => p.category === selectedCategory);

      grid.innerHTML = list.map(p => `
        <div class="product-card" data-id="${p.id}">
          <div>
            <div class="thumb">${renderVisual(p.visual, p.name)}</div>
            <span class="tag">${p.category}</span>
            <h3>${p.name}</h3>
            <p style="color: var(--muted); font-size: 0.88rem; margin-top: 4px;">${p.desc}</p>

            <div class="addons">
              <strong style="display:block; margin-bottom:4px; font-size:0.82rem;">إضافات جانبية:</strong>
              ${ADDONS.map(a => `
                <label>
                  <span>
                    <input type="checkbox" class="addon-chk" data-price="${a.price}" onchange="recalcPrice(${p.id}, ${p.price})" />
                    ${a.label}
                  </span>
                  <span>+${a.price} ر.س</span>
                </label>
              `).join("")}
            </div>
          </div>

          <div>
            <div class="price-row">
              <span>السعر الإجمالي:</span>
              <span id="total-${p.id}">${p.price} ر.س</span>
            </div>
            <div style="font-size: 0.82rem; color: var(--muted); margin-bottom: 8px;">
              المتوفر: ${p.qty > 0 ? p.qty + " قطعة" : "نفذت الكمية"}
            </div>
            <button class="btn" style="width:100%;" ${p.qty <= 0 ? "disabled" : ""} onclick="alert('تمت تجربة إضافة ${p.name} بنجاح!')">
              ${p.qty > 0 ? "تجربة اختيار المنتج" : "غير متوفر"}
            </button>
          </div>
        </div>
      `).join("");

      renderManageList();
    }

    function recalcPrice(id, basePrice) {
      const card = document.querySelector(`.product-card[data-id="${id}"]`);
      const checked = [...card.querySelectorAll(".addon-chk:checked")];
      const addonsSum = checked.reduce((sum, el) => sum + Number(el.dataset.price), 0);
      document.getElementById(`total-${id}`).textContent = `${basePrice + addonsSum} ر.س`;
    }

    function addProduct(e) {
      e.preventDefault();
      const name = document.getElementById("pName").value.trim();
      const desc = document.getElementById("pDesc").value.trim();
      const price = Number(document.getElementById("pPrice").value);
      const qty = Number(document.getElementById("pQty").value);
      const category = document.getElementById("pCat").value;
      const visual = document.getElementById("pVisual").value.trim() || "🍵";

      if (!name || isNaN(price) || price <= 0 || isNaN(qty) || qty < 0) {
        alert("تأكدي أن السعر أكبر من صفر والكمية غير سالبة.");
        return;
      }

      products.push({ id: Date.now(), name, desc, price, qty, category, visual });
      e.target.reset();
      document.getElementById("pQty").value = 10;
      document.getElementById("pVisual").value = "🍵";
      renderProducts();
    }

    function editProduct(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;

      const newPriceVal = prompt(`السعر الجديد للمنتج "${item.name}":`, item.price);
      if (newPriceVal === null) return;
      const newPrice = Number(newPriceVal);

      const newQtyVal = prompt(`الكمية المتوفرة الجديدة للمنتج "${item.name}":`, item.qty);
      if (newQtyVal === null) return;
      const newQty = Number(newQtyVal);

      if (isNaN(newPrice) || newPrice <= 0 || isNaN(newQty) || newQty < 0) {
        alert("أدخلي قيماً صحيحة (السعر أكبر من صفر والكمية غير سالبة).");
        return;
      }

      item.price = newPrice;
      item.qty = newQty;
      renderProducts();
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      renderProducts();
    }

    function renderManageList() {
      const box = document.getElementById("manageList");
      box.innerHTML = products.map(p => `
        <div class="admin-row">
          <div>
            <strong>${p.name}</strong> — <span>${p.price} ر.س</span>
            <small style="color: var(--muted);">(${p.category} | الكمية: ${p.qty})</small>
          </div>
          <div class="actions">
            <button class="btn btn-sm" onclick="editProduct(${p.id})">تعديل السعر والكمية</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">حذف</button>
          </div>
        </div>
      `).join("");
    }

    renderCategories();
    renderProducts();
  </script>
</body>
</html>
